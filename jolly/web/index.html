<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jolly Simulator</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0d10;--panel:#111419;--soft:#171b22;--line:#282e38;--text:#f2f4f7;--muted:#929ba8;--blue:#6ca7ff;--green:#51d88a;--red:#ff6b78}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
    button,select,input{font:inherit;color:var(--text);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px}button{cursor:pointer}button:hover{border-color:#4b5667}.primary{background:#2463bb;border-color:#377bd9}
    header{height:58px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);background:#0e1115}.brand{font-weight:750;font-size:17px;letter-spacing:-.02em}.brand span{color:var(--blue)}.spacer{flex:1}.connected{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
    main{height:calc(100vh - 58px);display:grid;grid-template-columns:minmax(0,1fr) 330px}.viewport{position:relative;overflow:hidden;background:#101318;border-right:1px solid var(--line)}
    #render{width:100%;height:100%;display:block;object-fit:contain;cursor:grab;user-select:none}.viewport.dragging #render{cursor:grabbing}.loading{position:absolute;inset:0;display:none;place-items:center;color:var(--muted);pointer-events:none}.loading.show{display:grid}
    .chips{position:absolute;top:14px;left:14px;display:flex;gap:7px}.chip{padding:6px 9px;border:1px solid #323946;border-radius:7px;background:#0c0f13d9;color:var(--muted);font:11px ui-monospace,monospace;backdrop-filter:blur(8px)}.chip strong{color:var(--text)}.chip.bad{border-color:#7b333b;color:var(--red)}
    .camera{position:absolute;top:14px;right:14px;display:flex;gap:6px}.camera button{min-width:39px;padding:7px;background:#0c0f13d9;backdrop-filter:blur(8px)}
    .hint{position:absolute;right:16px;bottom:72px;color:#b3bbc6;font-size:11px;text-shadow:0 1px 3px #000}
    .command{position:absolute;left:14px;right:14px;bottom:14px;display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid #323946;border-radius:10px;background:#0c0f13e8;backdrop-filter:blur(10px)}.command b{color:var(--blue);font:13px ui-monospace,monospace}.command input{flex:1;padding:7px 2px;border:0;background:transparent;outline:0;font:13px ui-monospace,monospace}.command button{padding:7px 12px}
    aside{overflow:auto;background:var(--panel)}.section{padding:16px;border-bottom:1px solid var(--line)}h2{margin:0 0 12px;color:var(--muted);font-size:11px;letter-spacing:.11em;text-transform:uppercase}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:11px;background:var(--soft);border:1px solid var(--line);border-radius:8px}.metric span{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.metric strong{font:13px ui-monospace,monospace}.safe{color:var(--green)!important}.unsafe{color:var(--red)!important}
    .joint{margin:11px 0}.joint:first-child{margin-top:0}.joint-head{display:flex;justify-content:space-between;font:12px ui-monospace,monospace}.joint-head span:first-child{color:#c3cad4}.joint-head span:last-child{color:var(--muted)}.bar{height:4px;margin-top:6px;background:#252b34;border-radius:8px;overflow:hidden}.fill{height:100%;background:var(--blue);border-radius:8px}.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font:12px/1.45 ui-monospace,monospace}.kv span{color:var(--muted)}.kv b{text-align:right;font-weight:500}.objects{display:flex;flex-wrap:wrap;gap:6px}.object{padding:6px 8px;background:var(--soft);border:1px solid var(--line);border-radius:7px;font:11px ui-monospace,monospace;color:#c9d0da}
    details{border-bottom:1px solid var(--line)}summary{padding:14px 16px;color:var(--muted);cursor:pointer;font-size:12px}pre{max-height:260px;margin:0;padding:0 16px 16px;overflow:auto;white-space:pre-wrap;color:#b7c0cc;font:11px/1.5 ui-monospace,monospace}
    @media(max-width:820px){body{overflow:auto}header{height:auto;min-height:58px;flex-wrap:wrap;padding:10px}.spacer{display:none}main{height:auto;display:block}.viewport{height:62vh;border-right:0;border-bottom:1px solid var(--line)}aside{overflow:visible}.hint{display:none}}
  </style>
</head>
<body>
  <header><div class="brand"><span>JOLLY</span> Simulator</div><select id="model" aria-label="Robot model"></select><select id="scene" aria-label="Scene"></select><div class="connected"><i class="dot"></i><span id="connection">Local</span></div><div class="spacer"></div><button id="reset">Reset</button><button class="primary" id="refresh">Refresh</button></header>
  <main>
    <section class="viewport" id="viewport">
      <img id="render" alt="Real-time PyBullet 3D render of the robot arm" draggable="false">
      <div class="loading" id="loading">Rendering physical model…</div>
      <div class="chips"><div class="chip">MODEL <strong id="model-chip">—</strong></div><div class="chip" id="collision-chip">COLLISION <strong>—</strong></div></div>
      <div class="camera"><button data-view="front" title="Front view">Front</button><button data-view="top" title="Top view">Top</button><button data-view="iso" title="Isometric view">3D</button></div>
      <div class="hint">Drag to orbit · Scroll to zoom</div>
      <form class="command" id="terminal"><b>jolly</b><input id="command" autocomplete="off" aria-label="Jolly command" placeholder="reach --x .3 --y 0 --z .2"><button type="submit">Run</button></form>
    </section>
    <aside>
      <div class="section"><h2>Robot state</h2><div class="summary"><div class="metric"><span>Safety</span><strong id="safety">—</strong></div><div class="metric"><span>Gripper</span><strong id="gripper">—</strong></div><div class="metric"><span>Scene</span><strong id="scene-value">—</strong></div><div class="metric"><span>Holding</span><strong id="held">—</strong></div></div></div>
      <div class="section"><h2>Joints</h2><div id="joints"></div></div>
      <div class="section"><h2>End effector</h2><div class="kv" id="pose"></div></div>
      <div class="section"><h2>Scene objects</h2><div class="objects" id="objects"></div></div>
      <details><summary>Last response</summary><pre id="output">Starting local simulator…</pre></details>
    </aside>
  </main>
<script>
const $=s=>document.querySelector(s);let state=null,appVersion='',camera={yaw:42,pitch:-28,distance:.85},drag=false,last=[0,0],renderTimer=0,renderToken=0;
async function api(path,options={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},...options});const data=await r.json();if(!r.ok)throw new Error(data.detail?.message||JSON.stringify(data.detail));return data}
function log(value){$('#output').textContent=typeof value==='string'?value:JSON.stringify(value,null,2)}
function updateImage(delay=0){clearTimeout(renderTimer);renderTimer=setTimeout(()=>{const token=++renderToken,v=$('#viewport'),width=Math.max(320,Math.min(1440,Math.round(v.clientWidth))),height=Math.max(240,Math.min(960,Math.round(v.clientHeight)));$('#loading').classList.add('show');const img=new Image();img.onload=()=>{if(token!==renderToken)return;$('#render').src=img.src;$('#loading').classList.remove('show')};img.onerror=()=>{$('#loading').classList.remove('show');log({ok:false,error:'3D render failed'})};img.src=`/api/render.png?yaw=${camera.yaw}&pitch=${camera.pitch}&distance=${camera.distance}&width=${width}&height=${height}&t=${Date.now()}`},delay)}
function renderState(s){state=s;const collision=s.collisions.collision;$('#model-chip').textContent=s.model.id.toUpperCase();$('#collision-chip').classList.toggle('bad',collision);$('#collision-chip strong').textContent=collision?`YES (${s.collisions.count})`:'CLEAR';$('#safety').textContent=collision?'COLLISION':'NOMINAL';$('#safety').className=collision?'unsafe':'safe';$('#gripper').textContent=s.gripper.toFixed(2);$('#scene-value').textContent=s.scene;$('#held').textContent=s.held_object||'none';$('#joints').innerHTML=s.joints.map(j=>{const pct=100*(j.position_degrees-j.limits_degrees[0])/(j.limits_degrees[1]-j.limits_degrees[0]);return `<div class="joint"><div class="joint-head"><span>${j.name}</span><span>${j.position_degrees.toFixed(1)}°</span></div><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,pct))}%"></div></div></div>`}).join('');const p=s.end_effector.position,e=s.end_effector.orientation_euler_degrees;$('#pose').innerHTML=`<span>Position</span><b>${p.map(v=>v.toFixed(3)).join(' / ')} m</b><span>Rotation</span><b>${e.map(v=>v.toFixed(1)).join(' / ')}°</b>`;$('#objects').innerHTML=s.objects.length?s.objects.map(o=>`<span class="object">${o.name}</span>`).join(''):'<span style="color:var(--muted)">No objects</span>';updateImage()}
async function refresh(verbose=false){try{const s=await api('/api/state');renderState(s);if(verbose)log(s);$('#connection').textContent=`Local · v${appVersion}`}catch(e){log({ok:false,error:e.message});$('#connection').textContent='Local · error'}}
async function reset(){try{const s=await api('/api/reset',{method:'POST',body:JSON.stringify({model:$('#model').value,scene:$('#scene').value})});renderState(s);log(s)}catch(e){log({ok:false,error:e.message})}}
async function setup(){const c=await api('/api/config');appVersion=c.version;$('#model').innerHTML=c.models.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');$('#scene').innerHTML=c.scenes.map(s=>`<option value="${s.id}">${s.id}</option>`).join('');await refresh();$('#model').value=state.model.id;$('#scene').value=state.scene;log({ok:true,message:'Ready. The viewport uses the physical PyBullet model and meshes.'})}
$('#refresh').onclick=()=>refresh(true);$('#reset').onclick=reset;$('#model').onchange=reset;$('#scene').onchange=reset;
$('#terminal').onsubmit=async event=>{event.preventDefault();const raw=$('#command').value.trim(),parts=raw.split(/\s+/),cmd=parts.shift();const opts={};for(let i=0;i<parts.length;i+=2)opts[parts[i]]=parts[i+1];try{let s;if(cmd==='state'||!cmd)s=await api('/api/state');else if(cmd==='reset')s=await api('/api/reset',{method:'POST',body:JSON.stringify({model:$('#model').value,scene:$('#scene').value})});else if(cmd==='reach')s=await api('/api/reach',{method:'POST',body:JSON.stringify({x:+opts['--x'],y:+opts['--y'],z:+opts['--z'],gripper:opts['--gripper']===undefined?null:+opts['--gripper']})});else if(cmd==='move')s=await api('/api/move',{method:'POST',body:JSON.stringify({joints:(opts['--joints']||'').split(',').map(Number),gripper:opts['--gripper']===undefined?null:+opts['--gripper']})});else throw new Error('Allowed commands: state, reset, reach, move');renderState(s);log(s)}catch(e){log({ok:false,error:e.message})}$('#command').value=''};
const viewport=$('#viewport');viewport.onpointerdown=e=>{if(e.target.closest('button,input,form'))return;drag=true;last=[e.clientX,e.clientY];viewport.classList.add('dragging');viewport.setPointerCapture(e.pointerId)};viewport.onpointermove=e=>{if(!drag)return;camera.yaw+=(e.clientX-last[0])*.35;camera.pitch=Math.max(-89,Math.min(20,camera.pitch-(e.clientY-last[1])*.25));last=[e.clientX,e.clientY];updateImage(120)};viewport.onpointerup=()=>{drag=false;viewport.classList.remove('dragging');updateImage()};viewport.onwheel=e=>{e.preventDefault();camera.distance=Math.max(.35,Math.min(2,camera.distance+e.deltaY*.0007));updateImage(80)};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const v=b.dataset.view;if(v==='front')camera={yaw:0,pitch:-12,distance:.85};else if(v==='top')camera={yaw:0,pitch:-89,distance:.9};else camera={yaw:42,pitch:-28,distance:.85};updateImage()});window.onresize=()=>updateImage(180);setup();
</script>
</body>
</html>
