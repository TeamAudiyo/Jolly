<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jolly Simulator</title>
  <style>
    :root { color-scheme: dark; --bg:#090c12; --panel:#10151f; --line:#263142; --muted:#8b99ab; --text:#e8edf5; --cyan:#55d8ff; --blue:#4285ff; --green:#3bd47f; --red:#ff5c68; --amber:#ffbb55; }
    * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--text); font:14px Inter,ui-sans-serif,system-ui,sans-serif; overflow:hidden }
    button,select,input { color:var(--text); background:#151c28; border:1px solid var(--line); border-radius:7px; padding:8px 10px; font:inherit }
    button { cursor:pointer } button:hover { border-color:#53657e } button.primary { background:#174f9e; border-color:#3179dd }
    .top { height:58px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line); padding:0 16px; background:#0d1119 }
    .brand { font-weight:800; font-size:18px; letter-spacing:.02em } .brand b { color:var(--cyan) } .spacer { flex:1 }
    .status { display:flex; align-items:center; gap:7px; color:var(--muted); font:12px ui-monospace,monospace } .dot { width:8px; height:8px; border-radius:50%; background:var(--green); box-shadow:0 0 10px var(--green) }
    .app { height:calc(100vh - 58px); display:grid; grid-template-columns:minmax(500px,1fr) 340px; grid-template-rows:minmax(420px,1fr) 210px }
    .viewport { position:relative; border-right:1px solid var(--line); overflow:hidden; background:radial-gradient(circle at 50% 40%,#182335,#090c12 70%) }
    canvas { width:100%; height:100%; display:block; cursor:grab } canvas:active { cursor:grabbing }
    .hud { position:absolute; left:14px; top:14px; display:flex; flex-wrap:wrap; gap:8px; max-width:calc(100% - 80px) } .chip { padding:6px 9px; border:1px solid var(--line); border-radius:6px; background:#0c111acc; color:var(--muted); font:12px ui-monospace,monospace }
    .chip strong { color:var(--text) } .collision { color:var(--red)!important; border-color:#7f3540!important }
    .camera { position:absolute; right:14px; top:14px; display:grid; gap:6px } .camera button { width:38px; padding:7px }
    .side { grid-row:1/3; grid-column:2; background:var(--panel); overflow:auto }
    .section { padding:16px; border-bottom:1px solid var(--line) } h2 { margin:0 0 12px; font-size:12px; color:var(--muted); letter-spacing:.12em; text-transform:uppercase }
    .kv { display:grid; grid-template-columns:1fr auto; gap:8px; font:12px ui-monospace,monospace }.kv span:nth-child(odd){color:var(--muted)}
    .joint { margin:11px 0 } .joint-head { display:flex; justify-content:space-between; font:12px ui-monospace,monospace }.joint-head span:first-child{color:#b9c4d3}.bar { height:5px; background:#212b3a; margin-top:6px; border-radius:9px; overflow:hidden }.fill { height:100%; background:linear-gradient(90deg,var(--blue),var(--cyan)); border-radius:9px }
    .safe { color:var(--green); font-weight:700 }.unsafe { color:var(--red); font-weight:700 }
    .console { grid-column:1; grid-row:2; border-right:1px solid var(--line); border-top:1px solid var(--line); background:#080b10; display:grid; grid-template-rows:34px 1fr 42px }
    .tabs { display:flex; gap:18px; align-items:center; padding:0 14px; border-bottom:1px solid #1c2532; color:var(--muted); font:12px ui-monospace,monospace }.tabs .active { color:var(--cyan) }
    pre { margin:0; padding:10px 14px; overflow:auto; color:#aebbd0; font:12px/1.45 ui-monospace,SFMono-Regular,monospace; white-space:pre-wrap }
    .prompt { display:flex; align-items:center; gap:8px; border-top:1px solid #1c2532; padding:5px 12px; font:13px ui-monospace,monospace }.prompt b{color:var(--cyan)}.prompt input{flex:1;border:0;background:transparent;outline:0;padding:7px 0;font:inherit}
    .objects { display:grid; gap:7px }.object { padding:8px; background:#151c27; border:1px solid #222d3d; border-radius:6px; font:12px ui-monospace,monospace }.object b{display:block;margin-bottom:4px}.object span{color:var(--muted)}
    @media(max-width:900px){body{overflow:auto}.app{height:auto;display:block}.viewport{height:55vh}.side{height:auto}.console{height:260px}.top{flex-wrap:wrap;height:auto;padding:10px}.spacer{display:none}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><b>JOLLY</b> / SIMULATOR</div><select id="model"></select><select id="scene"></select><div class="status"><i class="dot"></i><span id="connection">local · connected</span></div><div class="spacer"></div><button id="reset">Reset</button><button class="primary" id="refresh">Refresh state</button></header>
  <main class="app">
    <section class="viewport"><canvas id="view"></canvas><div class="hud"><div class="chip">MODEL <strong id="model-chip">—</strong></div><div class="chip">SCENE <strong id="scene-chip">—</strong></div><div class="chip" id="collision-chip">COLLISION <strong>—</strong></div></div><div class="camera"><button data-view="front">F</button><button data-view="top">T</button><button data-view="iso">3D</button></div></section>
    <aside class="side"><div class="section"><h2>Joint state</h2><div id="joints"></div></div><div class="section"><h2>End effector</h2><div class="kv" id="pose"></div></div><div class="section"><h2>Safety</h2><div class="kv" id="safety"></div></div><div class="section"><h2>Scene objects</h2><div class="objects" id="objects"></div></div></aside>
    <section class="console"><div class="tabs"><span class="active">console</span><span>jolly state --json</span><span>events</span></div><pre id="output">Starting local simulator…</pre><form class="prompt" id="terminal"><b>jolly</b><input id="command" autocomplete="off" placeholder="state | reset | reach --x .3 --y 0 --z .2 | move --joints 0,-20,60,-40,0,0"></form></section>
  </main>
<script>
const $=s=>document.querySelector(s); let state=null, yaw=-.75, pitch=.42, scale=620, fit=1, dragging=false, last=[0,0];
async function api(path, options={}){ const r=await fetch(path,{headers:{'Content-Type':'application/json'},...options}); const data=await r.json(); if(!r.ok) throw new Error(data.detail?.message||JSON.stringify(data.detail)); return data }
function log(data){$('#output').textContent=typeof data==='string'?data:JSON.stringify(data,null,2);$('#output').scrollTop=0}
function project(p,w,h){let [x,y,z]=p;let cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);let rx=cy*x-sy*y, ry=sy*x+cy*y;let rz=cp*z-sp*ry, depth=sp*z+cp*ry;return [w/2+rx*scale*fit,h*.78-rz*scale*fit,depth]}
function draw(){if(!state)return;const c=$('#view'),d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;fit=Math.min(1,w/930);c.width=w*d;c.height=h*d;const g=c.getContext('2d');g.scale(d,d);g.clearRect(0,0,w,h);g.lineWidth=1;g.strokeStyle='#243246';for(let i=-6;i<=6;i++){let a=project([i*.08,-.48,0],w,h),b=project([i*.08,.48,0],w,h);g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke();a=project([-.48,i*.08,0],w,h);b=project([.48,i*.08,0],w,h);g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}
const labels=[];for(const o of state.objects||[]){let q=project(o.position,w,h);g.fillStyle=o.graspable?'#3f8fff':'#7a5b38';g.fillRect(q[0]-8,q[1]-8,16,16);g.strokeStyle='#b8d6ff';g.strokeRect(q[0]-8,q[1]-8,16,16);labels.push([o.name,q[0]+11,q[1]])}
const pts=state.skeleton_points||[];if(pts.length){g.lineCap='round';g.lineJoin='round';for(let i=1;i<pts.length;i++){let a=project(pts[i-1],w,h),b=project(pts[i],w,h);g.strokeStyle=state.collisions.collision?'#ff5c68':i%2?'#48a8ff':'#55d8ff';g.lineWidth=10-i*.45;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}for(const p of pts){let q=project(p,w,h);g.fillStyle='#e8edf5';g.beginPath();g.arc(q[0],q[1],4,0,Math.PI*2);g.fill()}}g.font='11px monospace';for(const [t,lx,ly] of labels){const tw=g.measureText(t).width;g.fillStyle='#0c111acc';g.fillRect(lx-3,ly-10,tw+6,14);g.fillStyle='#c5d2e3';g.fillText(t,lx,ly)}
}
function render(s){state=s;$('#model-chip').textContent=s.model.id;$('#scene-chip').textContent=s.scene;const col=s.collisions.collision;$('#collision-chip').classList.toggle('collision',col);$('#collision-chip strong').textContent=col?`YES (${s.collisions.count})`:'CLEAR';$('#joints').innerHTML=s.joints.map(j=>{let pct=100*(j.position_degrees-j.limits_degrees[0])/(j.limits_degrees[1]-j.limits_degrees[0]);return `<div class="joint"><div class="joint-head"><span>${j.name}</span><span>${j.position_degrees.toFixed(2)}°</span></div><div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,pct))}%"></div></div></div>`}).join('');let p=s.end_effector.position,e=s.end_effector.orientation_euler_degrees;$('#pose').innerHTML=`<span>x / y / z</span><b>${p.map(v=>v.toFixed(3)).join(' / ')} m</b><span>roll / pitch / yaw</span><b>${e.map(v=>v.toFixed(1)).join(' / ')}°</b><span>gripper</span><b>${s.gripper.toFixed(2)}</b>`;$('#safety').innerHTML=`<span>status</span><b class="${col?'unsafe':'safe'}">${col?'COLLISION':'NOMINAL'}</b><span>held object</span><b>${s.held_object||'none'}</b><span>contacts</span><b>${s.collisions.count}</b>`;$('#objects').innerHTML=(s.objects.length?s.objects.map(o=>`<div class="object"><b>${o.name}</b><span>${o.position.map(v=>v.toFixed(3)).join(', ')}</span></div>`).join(''):'<span style="color:var(--muted)">No scene objects</span>');draw()}
async function refresh(verbose=false){try{const s=await api('/api/state');render(s);if(verbose)log(s)}catch(e){log({ok:false,error:e.message});$('#connection').textContent='local · error'}}
async function setup(){const c=await api('/api/config');$('#model').innerHTML=c.models.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');$('#scene').innerHTML=c.scenes.map(s=>`<option value="${s.id}">${s.id}</option>`).join('');await refresh();$('#model').value=state.model.id;$('#scene').value=state.scene;log({ok:true,message:'Jolly local simulator ready',commands:['state','reset','reach --x .3 --y 0 --z .2','move --joints 0,-20,60,-40,0,0']})}
$('#refresh').onclick=()=>refresh(true);$('#reset').onclick=async()=>{try{let s=await api('/api/reset',{method:'POST',body:JSON.stringify({model:$('#model').value,scene:$('#scene').value})});render(s);log(s)}catch(e){log({ok:false,error:e.message})}};$('#scene').onchange=$('#reset').onclick;$('#model').onchange=$('#reset').onclick;
$('#terminal').onsubmit=async e=>{e.preventDefault();let raw=$('#command').value.trim(),parts=raw.split(/\s+/),cmd=parts.shift();let opts={};for(let i=0;i<parts.length;i+=2)opts[parts[i]]=parts[i+1];try{let s;if(cmd==='state'||!cmd)s=await api('/api/state');else if(cmd==='reset')s=await api('/api/reset',{method:'POST',body:JSON.stringify({model:$('#model').value,scene:$('#scene').value})});else if(cmd==='reach')s=await api('/api/reach',{method:'POST',body:JSON.stringify({x:+opts['--x'],y:+opts['--y'],z:+opts['--z'],gripper:opts['--gripper']===undefined?null:+opts['--gripper']})});else if(cmd==='move')s=await api('/api/move',{method:'POST',body:JSON.stringify({joints:(opts['--joints']||'').split(',').map(Number),gripper:opts['--gripper']===undefined?null:+opts['--gripper']})});else throw new Error('Allowed commands: state, reset, reach, move');render(s);log(s)}catch(err){log({ok:false,error:err.message})}$('#command').value=''};
const cv=$('#view');cv.onpointerdown=e=>{dragging=true;last=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!dragging)return;yaw+=(e.clientX-last[0])*.008;pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-last[1])*.008));last=[e.clientX,e.clientY];draw()};cv.onpointerup=()=>dragging=false;cv.onwheel=e=>{e.preventDefault();scale=Math.max(260,Math.min(1000,scale-e.deltaY*.5));draw()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{let v=b.dataset.view;if(v==='front'){yaw=0;pitch=0}else if(v==='top'){yaw=0;pitch=1.5}else{yaw=-.75;pitch=.42}draw()});window.onresize=draw;setup();
</script>
</body>
</html>
