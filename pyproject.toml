[build-system]
requires = ["hatchling>=1.26,<1.32"]
build-backend = "hatchling.build"

[project]
name = "jolly-cli"
version = "0.6.0"
description = "CLI-native measured pick-and-place trials and multi-arm hardware control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "TeamAudiyo" }]
keywords = ["robotics", "so101", "hardware", "pybullet", "cli", "llm", "kinematics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "click>=8.1,<9",
  "platformdirs>=4.2,<5",
  "pybullet>=3.2.6,<4",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
hardware = ["pyserial>=3.5,<4"]
arms = ["lerobot>=0.6,<0.7; python_version >= '3.12'"]
arms-feetech = ["lerobot[feetech]>=0.6,<0.7; python_version >= '3.12'"]
arms-dynamixel = ["lerobot[dynamixel]>=0.6,<0.7; python_version >= '3.12'"]
markers = ["opencv-contrib-python-headless>=4.10,<5", "numpy>=2,<3"]
dev = ["pytest>=8.2,<9", "pytest-cov>=5,<7", "build>=1.2,<2", "httpx>=0.27,<1", "pyserial>=3.5,<4"]

[project.scripts]
jolly = "jolly.cli:main"

[project.urls]
Homepage = "https://github.com/TeamAudiyo/Jolly"
Repository = "https://github.com/TeamAudiyo/Jolly"
Issues = "https://github.com/TeamAudiyo/Jolly/issues"

[tool.hatch.build.targets.wheel]
packages = ["jolly"]
artifacts = ["jolly/assets/*.urdf", "jolly/assets/robots/**/*", "jolly/web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
