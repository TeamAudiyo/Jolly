[build-system]
requires = ["hatchling>=1.26,<1.32"]
build-backend = "hatchling.build"

[project]
name = "jolly-cli"
version = "0.3.0"
description = "Local, CLI-native robot-arm physics simulation for humans and LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "TeamAudiyo" }]
keywords = ["robotics", "simulation", "pybullet", "cli", "llm", "kinematics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "click>=8.1,<9",
  "platformdirs>=4.2,<5",
  "pybullet>=3.2.6,<4",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8.2,<9", "pytest-cov>=5,<7", "build>=1.2,<2", "httpx>=0.27,<1"]

[project.scripts]
jolly = "jolly.cli:main"

[project.urls]
Homepage = "https://github.com/TeamAudiyo/Jolly"
Repository = "https://github.com/TeamAudiyo/Jolly"
Issues = "https://github.com/TeamAudiyo/Jolly/issues"

[tool.hatch.build.targets.wheel]
packages = ["jolly"]
artifacts = ["jolly/assets/*.urdf", "jolly/assets/robots/**/*", "jolly/web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
